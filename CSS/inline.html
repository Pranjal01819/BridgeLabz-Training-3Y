<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Inline CSS Example</title>
</head>
<body style="font-family: Arial, sans-serif; background-color: #f2f2f2; padding: 20px;">
	<h1 style="color: rgb(16, 210, 22); text-align: center;">Welcome to Inline CSS</h1>

	<p style="color: #333; font-size: 18px;">
		This paragraph is styled using inline CSS.
	</p>
	<p style="color: rgb(139, 39, 182); font-size: 18px;">
		I am Nobody at Nowhere!
	</p>
	<button style="background-color: rgb(35, 131, 158); color: white; border: none; padding: 10px 20px;">
		Click Me
	</button>
</body>
</html>
