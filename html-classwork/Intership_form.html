<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="utf-8" />
	<meta name="viewport" content="width=device-width,initial-scale=1" />
	<title>Internship Application Form</title>
	<style>
		body{font-family:Arial,Helvetica,sans-serif;margin:20px}
		form{max-width:720px}
		.row{display:flex;gap:12px;align-items:center;margin-bottom:10px}
		label{min-width:140px}
		fieldset{margin-bottom:12px;padding:10px}
	</style>
</head>
<body>
	<h1>Internship Application Form</h1>

	<form action="#" method="post" enctype="multipart/form-data">
		<fieldset>
			<legend>Personal Details</legend>

			<div class="row">
				<label for="fullName">Full Name:</label>
				<input type="text" id="fullName" name="full_name" placeholder="Your full name" required />
			</div>

			<div class="row">
				<label for="email">Email:</label>
				<input type="email" id="email" name="email" placeholder="you@example.com" required />
			</div>

			<div class="row">
				<label for="phone">Phone:</label>
				<input type="tel" id="phone" name="phone" placeholder="123-456-7890" required />
			</div>

			<div class="row">
				<label for="dob">Date of Birth:</label>
				<input type="date" id="dob" name="date_of_birth" required />
			</div>

			<div class="row">
				<label for="password">Password:</label>
				<input type="password" id="password" name="password" placeholder="Choose a password" required />
			</div>

			<div class="row">
				<label>Gender:</label>
				<div>
					<input type="radio" id="gender_male" name="gender" value="Male" required />
					<label for="gender_male">Male</label>
					<input type="radio" id="gender_female" name="gender" value="Female" />
					<label for="gender_female">Female</label>
					<input type="radio" id="gender_other" name="gender" value="Other" />
					<label for="gender_other">Other</label>
				</div>
			</div>
		</fieldset>

		<fieldset>
			<legend>Education & Skills</legend>

			<div class="row">
				<label for="course">Course:</label>
				<select id="course" name="course" required>
					<option value="" disabled selected>Select your course</option>
					<option value="CSE">CSE</option>
					<option value="IT">IT</option>
					<option value="ECE">ECE</option>
					<option value="Mechanical">Mechanical</option>
				</select>
			</div>

			<div class="row">
				<label>Skills:</label>
				<div>
					<input type="checkbox" id="skill_java" name="skills[]" value="Java" />
					<label for="skill_java">Java</label>
					<input type="checkbox" id="skill_js" name="skills[]" value="JavaScript" />
					<label for="skill_js">JavaScript</label>
					<input type="checkbox" id="skill_html" name="skills[]" value="HTML" />
					<label for="skill_html">HTML</label>
					<input type="checkbox" id="skill_css" name="skills[]" value="CSS" />
					<label for="skill_css">CSS</label>
					<input type="checkbox" id="skill_react" name="skills[]" value="React" />
					<label for="skill_react">React</label>
				</div>
			</div>
		</fieldset>

		<fieldset>
			<legend>Internship Details</legend>

			<div class="row">
				<label>Internship Preference:</label>
				<div>
					<input type="radio" id="pref_remote" name="internship_pref" value="Remote" required />
					<label for="pref_remote">Remote</label>
					<input type="radio" id="pref_onsite" name="internship_pref" value="On-site" />
					<label for="pref_onsite">On-site</label>
					<input type="radio" id="pref_hybrid" name="internship_pref" value="Hybrid" />
					<label for="pref_hybrid">Hybrid</label>
				</div>
			</div>

			<div class="row">
				<label for="resume">Upload Resume:</label>
				<input type="file" id="resume" name="resume" accept=".pdf,.doc,.docx" required />
			</div>

			<div style="margin-top:8px">
				<label for="cover_letter">Cover Letter:</label><br />
				<textarea id="cover_letter" name="cover_letter" rows="6" cols="60" placeholder="Write a short cover letter..." required></textarea>
			</div>
		</fieldset>

		<div style="margin-top:12px">
			<button type="submit">Submit Application</button>
			<button type="reset">Reset</button>
		</div>
	</form>
</body>
</html>
