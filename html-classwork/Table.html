<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Simple HTML Table</title>
  <style>
    table {
      width: 100%;
      border-collapse: collapse;
    }
    th, td {
      border: 1px solid #333;
      padding: 8px;
      text-align: left;
    }
    th {
      background-color: #f2f2f2;
    }
  </style>
</head>
<body>
  <h1>Student Scores</h1>
  <table>
    <thead>
      <tr>
        <th>Student</th>
        <th>Math</th>
        <th>Science</th>
        <th>English</th>
      </tr>
    </thead>
    <tbody>
      <tr>
        <td>Alice</td>
        <td>95</td>
        <td>88</td>
        <td>92</td>
      </tr>
      <tr>
        <td>Bob</td>
        <td>85</td>
        <td>90</td>
        <td>80</td>
      </tr>
      <tr>
        <td>Charlie</td>
        <td>78</td>
        <td>84</td>
        <td>88</td>
      </tr>
    </tbody>
  </table>
</body>
</html>
