<!DOCTYPE html>
<html>
<head>
    <title>Slider</title>
    <style>
        .slider{
            width: 500px;
            height:300px;
            overflow: hidden;
        }
        .slides{
            display: flex;
            width: 1500;
            animation: slider 10s infinite;
        }
        .slides img{
            width: 500px;
            height: 300px;
            object-fit: cover;

        }
        @keyframes slider{
            0%{
                transform: translateX(0);
            }
            30%{
                transform: translateX(-500px);
            }
            60%{
                transform: translateX(-1000px);
            }
            100%{
                transform: translateX(0);
            }

        }
    </style>
</head>
<body>
    <div class= "slider">
         <div class="slides">
             <img src="" alt="">
               <img src= alt="">
               <img src= alt="">
               <img src= alt="">
        </div>
    </div>
</body>
</html>
